ents.","source_ids":["S051"]},{"anchor":"NCCAP Area 3 and Area 6","detail":"Integrate gender and youth engagement in forest restoration and biodiversity; support community-based DRM.","source_ids":["S010 p.24","S010 p.29"]}],"scaling_pathway":{"funders":["Global Affairs Canada Green Growth project (existing)","Education Cannot Wait","GCF and Adaptation Fund education or youth windows","National education budgets"],"how":"An approved module and monitoring network can be adopted into existing youth and education programmes. Source IDs: S036, S010 p.36.","source_ids":["S036","S010 p.36"]},"consortium":{"lead":"SOS Children's Villages Somalia","local_partner":"A Somali education or youth NGO or vocational institute receiving at least 25%","government_role":"Ministry of Education and MoECC approve the module and use data. No funds to government.","academic_private":"A Somali university or teacher training college. A technology company may help with a simple data app, unfunded for commercial use.","notes":"Closest to SOS's own mission, with the strongest fit with its Canada-funded work."},"exit_strategy":"The approved module is held by education authorities and the vocational institutes. The youth network is owned by youth groups and schools with a local partner as secretariat. Roles written by month 6.","budget":{"lines":[{"line":"Output 1: EbA content and curriculum co-design with technical and vocational institutes and schools","usd":73500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: teacher and instructor training and mentoring","usd":67500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: EbA and education technical advice","usd":27000,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: youth-led community EbA monitoring network and learning platform","usd":67500,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: link to national education adaptation roadmap and climate information systems","usd":33500 outh numbers, S038, S010 p.7). The NCCAP gives general support but less detail than for other sectors.","sos_fit":"Highest. Core mission and Green Growth experience (S032, S036, S037).","security_access":"Medium. Schools in secure urban areas are accessible. Site list is for a restricted annex.","esms_notes":"Low to medium (self-assessed). Safeguarding of minors, consent, data privacy for young monitors.","fpic_land_clan":"Low land issues. Ensure minority-clan and displaced learners are included.","conflict_sensitivity":"Low to medium. Include learners from different clans and displaced groups.","feasibility_24m":"Feasible. Curriculum approval depends on education authority timing.","evidence_notes":"Policy anchors are broader than for other options. I did not read the education adaptation roadmap. Overlap with Green Growth needs checking.","duration_months":24,"esms_self_assessed":"Low to medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Classroom and community monitoring. No physical works."}]`),KG={options:VG},YG={label:"Criteria are derived from the Fund's selection criteria and stated priorities (S002 printed p.7-13, S001 p.3-7) plus SOS-specific criteria. The Fund does not publish scoring weights. I cannot confirm any reviewer weighting."},XG=[{id:"C1",name:"Fit with Fund objectives and pillars",origin:"fund",default_weight:12,description:"One strategic objective, at most two pillars with the allowed combination, optional theme alignment, and no stand-alone field work.",basis:"S001 p.3-4; S002 printed p.3-6, p.12"},{id:"C2",name:"Catalytic and scaling potential",origin:"fund",default_weight:12,description:"Does the work position a larger funder or government budget? The Fund wants catalytic work that develops larger proposals to other funders.",basis:"S002 printed p.7-8; S001 p.4"},{id:"C3",name:"Innovation and added value over er and money.","sources":["S024"]},"C11":{"score":4,"rationale":"Blue finance and payment options match Theme 1.","sources":["S001 p.4"]},"C12":{"score":3,"rationale":"Moderate risk of excluding poorer fishers and of for-profit leakage.","sources":["S002 printed p.14"]}},"OPT-D":{"C1":{"score":4,"rationale":"SO2 with policy and risk data fits Theme 3. Urban is already the largest sector in the portfolio (16 of 62).","sources":["S001 p.5-6","S004"]},"C2":{"score":4,"rationale":"World Bank SURP II and a UNDP and GEF urban project give routes. A Municipal Climate Finance Toolkit is a named NCCAP project.","sources":["S022","S048","S010 p.28"]},"C3":{"score":3,"rationale":"Urban has many precedents. Added value is the fragile displacement setting, not the tool idea.","sources":["S004"]},"C4":{"score":5,"rationale":"NCCAP Area 5 has explicit municipal targets and a finance toolkit project.","sources":["S010 p.27-28"]},"C5":{"score":4,"rationale":"IDP site counts and SURP II results exist, with some conflicts between sources.","sources":["S029","S022","S033"]},"C6":{"score":4,"rationale":"Urban setting, existing data and SOS presence in Banadir.","sources":["S035"]},"C7":{"score":4,"rationale":"SOS works with displaced families in Banadir and runs a Banadir programme.","sources":["S033","S035"]},"C8":{"score":4,"rationale":"Benadir Regional Administration sees SURP II work as a model.","sources":["S022"]},"C9":{"score":4,"rationale":"The design includes an engagement mechanism for women, youth and displaced residents.","sources":["S010 p.27"]},"C10":{"score":3,"rationale":"The planning tool lasts. Maintenance finance is the weak point.","sources":["S022"]},"C11":{"score":3,"rationale":"Municipal revenue is weak. Donor programmes exist.","sources":["S022"]},"C12":{"score":3,"rationale":"Eviction risk and privacy of displaced households.","sources":["S029"]}},"OPT-E":{"C1":{"score":4,"rationale":"SO2 with two Pillar 1 levers. The Fund requires gender responsiveness, but the utes in secure areas, with SOS's existing education work.","sources":["S030","S035"]},"C7":{"score":5,"rationale":"Core mission with 1,400 learners and the Green Growth project.","sources":["S030","S036","S037"]},"C8":{"score":4,"rationale":"Education authorities and institutes are accessible partners.","sources":["S035"]},"C9":{"score":4,"rationale":"Targets girls and young women. Youth under 30 are over 70% of the population.","sources":["S010 p.7"]},"C10":{"score":4,"rationale":"A curriculum inside the education system persists. The youth network needs a secretariat.","sources":["S002 printed p.20"]},"C11":{"score":2,"rationale":"Little climate finance would follow an education module.","sources":["S010 p.39"]},"C12":{"score":4,"rationale":"Safeguarding of minors is managed through certified policies, but needs care.","sources":["S034"]}}}`),ZG={scores:QG},ez=JSON.parse(`[{"id":"S001","title":"Call for Proposals for Medium-Size Grants","publisher":"Global EbA Fund (IUCN and UNEP, funded by IKI/BMUKN)","url":"I cannot confirm this (file name: Global-EbA-Fund_Medium-size-grants-Call-for-Proposals.pdf; landing page https://globalebafund.org/medium-size-grants/)","published":"2026-08","accessed":"2026-10-24","access_status":"read_in_full","type":"call_document","notes":"Supplied by user as PDF in chat. Nine pages. Page numbers equal printed numbers."},{"id":"S002","title":"Grants Procedure Manual","publisher":"Global EbA Fund (IUCN and UNEP, funded by IKI/BMUKN)","url":"I cannot confirm this (file name: Global-EbA-Fund-Grants-Procedure-Manual.pdf; latest version stated to be at www.GlobalEbAFund.org)","published":"2026-08","accessed":"2026-10-24","access_status":"read_in_full","type":"call_document","notes":"Supplied by user as PDF in chat. Thirty PDF pages. Printed page = PDF page minus 4."},{"id":"S003","title":"Global EbA Fund Grants 2026: Medium-Size Grants (climate finance bulletin)","publisher":"NDC Partnership","url":"https://ndcpartnership.org/knowledge-porta  may be added. If two Pillar 1 options are chosen, Pillar 2 and 3 cannot be added.",quote:"if you are selecting Pillar 2 or Pillar 3, then only one option under Pillar 1 can be selected in addition. If you are selecting two options under Pillar 1, Pillar 2 or 3 cannot be selected in addition.",cite:"MANUAL printed p.12 / PDF p.16"},{id:"R13",rule:"Pillar 1 levers: policy and policy instruments; education, capacity building and skills development; financing; working through the value chain; other (specify).",cite:"MANUAL printed p.12 / PDF p.16; detail printed p.4-5 / PDF p.8-9"},{id:"R14",rule:"Pillar 2 is Functional Data and Science. Projects under it must also develop operational plans for use and adoption of the knowledge generated.",quote:"projects under this pillar are also requested to develop means/operational plans for the application, use and adoption of the information/knowledge generated",cite:"MANUAL printed p.6 / PDF p.10"},{id:"R15",rule:"Pillar 3 is Innovation for Adaptation: unproven, early-stage or new-context approaches, unconventional partnerships, novel sectors, strategic pilots with high scaling potential through public budgets, private investment, philanthropy or multilateral funds (GCF, GEF, Adaptation Fund).",cite:"MANUAL printed p.6 / PDF p.10"}],uz=[{id:"R20",rule:"One outcome per project.",quote:"A proposed project should have one outcome and maximum of four outputs",cite:"MANUAL printed p.18 / PDF p.22"},{id:"R21",rule:"Maximum four outputs. One to two outputs are strongly encouraged.",quote:"it is strongly advised to limit the number of outputs (1-2 is encouraged)",cite:"MANUAL printed p.18-19 / PDF p.22-23"},{id:"R22",rule:"Maximum five activities per output.",quote:"Each output can have a maximum of five activities.",cite:"MANUAL printed p.19 / PDF p.23"},{id:"R23",rule:"At least three indicators from the Fund's Core Indicator Framework must be built into the logframe. The Secretariat may add more.",quote:"applicants are required to identify at least three relevant indicators from the Core Indicator Framework of the Fund",cite:"MANUAL printed p.20 / PDF p.24",note:"The Core Indicator Framework itself is NOT in the two PDFs. It is linked only. It must be retrieved from the Fund website."},{id:"R24",rule:"A baseline must be established for all indicators. Indicators must be SMART.",quote:"a baseline must be established for all indicators",cite:"MANUAL printed p.19 / PDF p.23"},{id:"R25",rule:"Indicators must include gender disaggregation where relevant.",quote:"Indicators must include gender-disaggregation, were relevant.",cite:"MANUAL printed p.18 / PDF p.22",note:"The PDF text says 'were relevant'. This is a typo for 'where relevant'."},{id:"R26",rule:"Outcome means new or improved policies, plans and practices implemented by target groups. Outputs are concrete products and services.",cite:"MANUAL printed p.18 / PDF p.22"},{id:"R27",rule:"Changes to outcome, outputs and project-specific indicators after signing need prior Secretariat approval.",cite:"MANUAL printed p.19 / PDF p.23"}],dz=[{id:"R30",rule:"No business-as-usual activities and no stand-alone field implementation projects.",quote:"the Fund does not support business-as-usual activities or stand-alone field implementation projects",cite:"CALL p.3"},{id:"R31",rule:"Projects must not focus primarily on field implementation. Field work is allowed only if clearly justified.",quote:"Projects must not focus primarily on field implementation in the scope of the proposal. Field interventions are allowed if clearly justified.",cite:"MANUAL printed p.3 / PDF p.7; printed p.7 / PDF p.11"},{id:"R32",rule:"Projects must add value to or scale existing work, fill a gap, or help develop a larger proposal to another funder. They should not be standalone.",cite:"MANUAL printed p.7 / PDF p.11"},{id:"R33",rule:"Projects must be catalytic and/or innovative.",cite:"MANUAL printed p.7 / PDF p.11; definitions printed p.4 / PDF p.8"},{id:"R34",rule:"Call priority: embed EbA in NAPs, NDCs, NBSAPs, LDN targets. Pilot transferable adaptation models. Build investment incentives through innovative finance.",cite:"CALL p.3"},{id:"R35",rule:"Call encourages regions not previously supported by the Fund, and knowledge products from research institutions and universities tailored to policymakers and practitioners.",quote:"The Fund encourages proposals that extend the reach of the Fund's portfolio by engaging geographical regions that have not previously benefited from Global EbA Fund support.",cite:"CALL p.3-4"},{id:"R36",rule:"Expected outcomes: strengthened enabling environment for EbA uptake and investment; locally led EbA interventions with documented replication pathways; improved technical and institutional capacity for policy uptake, investment-ready concepts and financing strategies.",cite:"CALL p.7"}],fz=[{id:"R40",rule:"Country-level activities require a consortium with one or more local organisations. At least 25% of the budget must go to local partners, subject to due diligence.",quote:"For projects with country-level activities a consortium with one or more local organizations is required with at least 25% of the budget allocated to local partners",cite:"CALL p.8",note:"Open question: whether SOS Children's Villages Somalia itself counts as a 'local organisation' is not defined in either PDF. I cannot confirm this."},{id:"R41",rule:"Consortium must show mechanisms for capacity transfer, shared decision-making and long-term institutional strengthening.",cite:"CALL p.8"},{id:"R42",rule:"Government entities may be in the consortium but cannot receive Fund money. No grants or sub-grants to government at any level.",quote:"The Fund will not grant directly to government partners. Sub-granting to governments at any level is also not permitted.",cite:"MANUAL printed p.13 / PDF p.17; printed p.15 / PDF p.19; CALL p.8"},{id:"R43",rule:"UNEP and IUCN global, regional or country offices cannot apply and cannot receive funding or sub-grants. They may collaborate in kind.",cite:"MANUAL printed p.13 / PDF p.17; printed p.14 / PDF p.18; CALL p.8"},{id:"R44",rule:"Eligible recipients: NGOs, INGOs, IGOs, CBOs, Indigenous Peoples' Organisations, universities, research institutes and think tanks, private companies, consortia. One lead 'Applicant Organisation' is the contract party.",cite:"MANUAL printed p.14 / PDF p.18; CALL p.7-8"},{id:"R45",rule:"Private sector: no funding for sector-specific obligations, compensatory measures or for-profit activities. For-profit applicants must show the project is strictly non-profit and generates no income.",quote:"for-profit organisations must clearly demonstrate that the proposed project pursues strictly non-profit objectives and does not generate any income",cite:"MANUAL printed p.14 / PDF p.18; printed p.23 / PDF p.27",note:"Tension to resolve: Theme 1 (CALL p.4) invites 'profitable, scalable business models'. Private partners cannot receive money for for-profit activity. Design finance options so Fund money pays for analysis, capacity and pilots, not commercial revenue."},{id:"R46",rule:"Co-financing is not required but shows institutional investment.",cite:"MANUAL printed p.14 / PDF p.18"},{id:"R47",rule:"Applicant must be a recognised legal entity able to operate legally in the project country. A government MoU or endorsement letter may support this.",cite:"MANUAL printed p.13 / PDF p.17; printed p.23 / PDF p.27"},{id:"R48",rule:"The Fund seeks unlikely matches and non-traditional partners. Local and community organisations strongly encouraged.",cite:"MANUAL printed p.14 / PDF p.18; CALL p.7"}],pz=[{id:"R50",rule:"Exit strategy is mandatory, with roles and responsibilities of each partner. Actions start from the outset. Allocation in the budget is encouraged.",quote:"Exit strategy for the project is a requirement and planned actions are to be initiated from the outset of project implementation.",cite:"MANUAL printed p.8 / PDF p.12; printed p.20-21 / PDF p.24-25"},{id:"R51",rule:"External audit is required and its cost must be in the project budget.",quote:"It is required to undertake an external audit for the project funded by the Global EbA Fund. The costs for such audit should be included in the project budget.",cite:"MANUAL printed p.25 / PDF p.29"},{id:"R52",rule:"Alignment with FEBA EbA Qualification Criteria and Quality Standards (5 criteria: reduces social and environmental vulnerabilities; generates societal benefits; restores, maintains or improves ecosystem health; supported by policies at multiple levels; supports equitable governance and enhances capacities).",cite:"MANUAL printed p.7 / PDF p.11; printed p.8-12 / PDF p.12-16"},{id:"R53",rule:"ESMS screening by the Secretariat. High-risk projects are not eligible. The ESMS questionnaire is requested only from shortlisted applicants.",quote:"Projects that are determined as High-Risk will not be eligible to receive funding.",cite:"MANUAL printed p.14 / PDF p.18; printed p.21 / PDF p.25"},{id:"R54",rule:"Gender-responsive design: gender analysis informs design, budgeting, staffing, implementation, M&E. Budget must include gender and inclusion allocations. Project must not exacerbate gender inequality, including gender-based violence. Mitigations go in the ESMS questionnaire.",cite:"MANUAL printed p.11 / PDF p.15; printed p.20 / PDF p.24"},{id:"R55",rule:"FPIC must be upheld where Indigenous Peoples are directly or indirectly affected.",quote:"Projects with direct and indirect impact on Indigenous Peoples must uphold the right of Indigenous Peoples to Free, Prior and Informed Consent (FPIC)",cite:"MANUAL printed p.12 / PDF p.16"},{id:"R56",rule:"Climate risk and vulnerability assessment, impact-chain analysis, use of best available science and traditional knowledge.",cite:"MANUAL printed p.8-9 / PDF p.12-13"},{id:"R57",rule:"Clear policy linkages to national, subnational, regional or global policies (NAPs, NDCs, National Communications, NBSAPs, LDN targets, Sendai, drought plans, social targets), and a plan or potential to influence them. Replicability required.",cite:"MANUAL printed p.10-11 / PDF p.14-15"},{id:"R58",rule:"Participatory and inclusive design, including women, youth and Indigenous Peoples and people who may be adversely affected.",cite:"MANUAL printed p.11-12 / PDF p.15-16"}],hz=[{id:"R60",rule:"Application documents: eligibility screening questionnaire; due diligence and financial capacity questionnaire with Annex 1(c)(i) articles of incorporation and Annex 1(c)(ii) in-country registration certificate; application form (medium); detailed budget (Excel); signed Applicant Declaration; Co-Applicant mandate form for consortia; CVs of main personnel. All in English.",cite:"MANUAL printed p.17 / PDF p.21"},{id:"R61",rule:"Due diligence topics include legal status, governance, five recent relevant projects, annual budget, revenue sources, audited statements for last completed year, controls, procurement, safeguard policies, past EbA experience, local presence.",cite:"MANUAL printed p.15 / PDF p.19"},{id:"R62",rule:"Only shortlisted applicants submit the ESMS questionnaire and the remaining due diligence documents.",cite:"MANUAL printed p.21 / PDF p.25"},{id:"R63",rule:"Disbursement: 30% first instalment, then twice yearly on interim financial reports due 15 January and 15 July, once 80% of the prior tranche is spent. At least 10% withheld until the final financial and audit report, due within 90 days of project end.",cite:"MANUAL printed p.21-22 / PDF p.25-26"},{id:"R64",rule:"Narrative progress reports 15 January and 15 July. Final narrative report within 30 days of project end. Core Indicator reporting annually by 15 January.",cite:"MANUAL printed p.22 / PDF p.26"},{id:"R65",rule:"Project start date is the final signature of the grant agreement. IUCN signs first.",cite:"MANUAL printed p.21 / PDF p.25"},{id:"R66",rule:"Time recording system required for staff costs. Software-based accounting required.",cite:"MANUAL printed p.23 / PDF p.27"},{id:"R67",rule:"Ineligible costs include costs without proof, outside the grant period, insurance not required by law, business or first-class flights, and costs that cannot be attributed to the project.",cite:"MANUAL printed p.24 / PDF p.28"},{id:"R68",rule:"Grantees must comply with IUCN anti-fraud, anti-corruption, safeguarding and whistleblowing policies and IUCN procurement policy. Financial information is published on the Fund website.",cite:"MANUAL printed p.25-26 / PDF p.29-30"}],mz=[{id:"T1",name:"Innovative Finance Solutions for EbA",summary:"Private capital and blended finance for EbA. Bankability, business case, EbA-derived value chains and trade, bankable project pipelines for global climate funds and MDBs, de-risking larger capital flows.",cite:"CALL p.4"},{id:"T2",name:"EbA for Human Development and Security",summary:"Fragile and conflict-affected settings. Integrate EbA into security, humanitarian, development and peacebuilding planning. Identify and address policy, regulatory, financial or awareness barriers to EbA investment in high-risk zones. Must show a clear, measurable pathway for reducing natural-resource tension and climate-induced fragility. Community co-designed, conflict-sensitive.",cite:"CALL p.4-5"},{id:"T3",name:"Interlinkages for people-nature-climate-land synergies: from policy alignment to investable action",summary:"Operational synergies across UNFCCC, CBD, UNCCD and Sendai. Led by non-government organisations working with national governments. Tools such as joint planning, cross-ministerial coordination, decision-support tools, harmonised monitoring. EbA as the central anchor.",cite:"CALL p.5-6"},{id:"T_RULE",rule:"Alignment with one theme is welcomed but not required.",cite:"CALL p.4"}],gz={note:"The Manual lists '9 criteria' but numbers only criterion 1 (with five FEBA sub-questions 1.1 to 1.5) and then lists questions 2 to 9 as eligibility-type yes/no items. The call text does not name nine distinct scored criteria with weights. I cannot confirm any scoring weights used by reviewers.",cite:"MANUAL printed p.8-13 / PDF p.12-17",items:[{n:1,text:"Contributes to an enabling environment for EbA and aligns with FEBA EbA Qualification Criteria and Quality Standards (sub-questions 1.1 to 1.5)."},{n:2,text:"Aligns with one Strategic Objective (select one)."},{n:3,text:"Action pillar selection (maximum two, combination rules)."},{n:4,text:"Grant amount within USD 500,000 (medium)."},{n:5,text:"Duration 24 months or less."},{n:6,text:"Targets ODA-eligible countries."},{n:7,text:"No funding to government partners."},{n:8,text:"No funding to UNEP or IUCN offices."},{n:9,text:"Applicant legally able to operate in the country, with supporting documentation."}]},yz=["Core Indicator Framework wording is not in the PDFs. It must be retrieved from the Fund site before indicators are written.","The 'local organisation' definition for the 25% rule is not given. Confirm with the Fund (Contact.EbAFund@iucn.org) whether SOS Somalia counts or must be the lead with a separate local partner receiving 25%.","Call allows only 10 medium grants. Selection weights are not published.","Somalia ODA eligibility on the current DAC list is not in the PDFs.","Manual disclaimer (printed p.i of cover pages / PDF p.2): the manual is general information and not legally binding. The website version is the latest."],vz=[{id:"F01",rule:"Seed-grant programmes are not supported. No cash sub-grant schemes run by the project.",quote:"No, the Global EbA Fund will not support a seed grants program directly.",cite:"S006 p.5",note:"Design implication: options must not rely on small grants to women's groups or youth groups. Use capacity, finance design and policy instead."},{id:"F02",rule:"A second phase of a previously funded project will not be supported. Previous grantees may apply for a different project area.",cite:"S006 p.2"},{id:"F03",rule:"Projects must build on existing work and must not consist exclusively of field implementation.",cite:"S006 p.1 and p.4"},{id:"F04",rule:"Lead applicant and partners must be legally recognised entities with prior similar experience. Lead may be based outside the project country if it has work experience there and one or more local partners.",cite:"S006 p.2"},{id:"F05",rule:"Documents to upload: Theory of Change and Logframe form, budget template, CVs, organigram, map of project location if available. English only. Non-English applications are not reviewed.",cite:"S006 p.4"},{id:"F06",rule:"Organisations may submit more than one proposal, each under its own portal account.",cite:"S006 p.3"},{id:"F07",rule:"Review starts after the window closes. No individual feedback for unsuccessful applicants. Selected projects expected to start in 2027.",cite:"S006 p.5"},{id:"F08",rule:"Theory of Change narrative is limited to 500 words. Outcome and each output can have at most 6 milestones. Indicators need a measurable baseline and target.",cite:"S007 (ToC and Logframe form)"},{id:"F09",rule:"Core Indicator Framework has 12 indicators. Select at least three. See data/core_indicators.json for exact wording.",cite:"S005"},{id:"F10",rule:"DISCREPANCY: the Fund's medium-size grants web page says no minimum local share is specified. The Call PDF and FAQ both state at least 25% to local partners. This tool follows the PDF and FAQ.",cite:"S008 vs S001 p.8 and S006 p.2"}],bz={_meta:sz,call_basics:lz,strategic_objective_and_pillars:cz,results_framework:uz,scope_limits:dz,partnership_and_funding:fz,mandatory_components:pz,application_and_finance_process:hz,optional_themes:mz,selection_criteria:gz,gaps_and_flags:yz,faq_and_web_rules:vz},_z=[{id:"CI1",number:1,cluster:"Cluster I: Policy engagement, institutional strengthening and M&E",wording:"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.",cite:"S005 PDF p.4-7",disaggregation:"Type, legal status, level (global, regional, national, subnational), stage (in development; developed: formally proposed, adopted, under implementation; influenced: engaged, formally proposed, adopted, implemented).",gender_note:"No gender disaggregation field. Gender can be added as a project-specific sub-indicator (for example, policy instruments with gender provisions).",caveats:"Only policies directly targeted by the project. Each jurisdiction is a separate entry. Supporting documents required."},{id:"CI2",number:2,cluster:"Cluster I: Policy engagement, institutional strengthening and M&E",wording:"Number of new or improved institutionalised coordination mechanisms established within or across sectors and at different scales (global, regional, national, sub-national) that address ecosystem-based approaches for adaptation to climate change as a result of project activities.",cite:"S005 PDF p.7-8",disaggregation:"Level, stakeholder types (government, NGOs, private sector, local communities, vulnerable populations), functions, duration, budget allocation.",gender_note:"Women's participation can be tracked through the stakeholder list as a project-specific sub-indicator.",caveats:"Must be institutionalised with a longer-term goal. Ad-hoc consultations do not count."},{id:"CI3",number:3,cluster:"Cluster I: Policy engagement, institutional strengthening and M&E",wording:"Number of monitoring, evaluation and learning (MEL) instruments introduced or improved to monitor the effectiveness of ecosystem-based adaptation measures aimed to improve resilience of ecosystems and communities as a result of project activities. The indicator can be set at various scales (global, regional, national, or sub-national as well as sector/ecosystem-specific) depending on the scope of the project.",cite:"S005 PDF p.9-11",disaggregation:"New or improved, level, focus, established by (government; NGO, university or research institute; private sector; community-based).",gender_note:"No gender field. Add a project-specific sub-indicator on sex-disaggregated data in the instrument.",caveats:"Must explain how the instrument is maintained after the project and what resources are allocated. Cannot duplicate what is reported under CI1 or CI2."},{id:"CI4",number:4,cluster:"Cluster II: Socio-economic development",wording:"Number of people/beneficiaries supported by the project (directly and indirectly) who have increased their resilience on climate change adaptation through ecosystem-based approaches.",cite:"S005 PDF p.11-13",disaggregation:"Direct and indirect, by gender and Indigenous Peoples status. Type of beneficiary includes women's groups or associations, farmer, aquaculturist or fisher group, youth (15 to 24).",gender_note:"Gender disaggregation is built in.",caveats:"Direct beneficiaries need high-intensity support; training attendance of at least 80% is the example given. Projects focused solely on strategy or policy development cannot report under this indicator, and public officials trained are not counted."},{id:"CI5",number:5,cluster:"Cluster II: Socio-economic development",wording:"Number of supply chains made more stable through ecosystem-based approaches as a result of project activities.",cite:"S005 PDF p.14-15",disaggregation:"Level, commodity type (agricultural crops; livestock and animal products; fisheries and aquaculture; forestry and wood products; non-timber forest products; other), EbA practice.",gender_note:"No gender field. Add a project-specific sub-indicator.",caveats:"One row per supply chain. Stability shown by more consistent yields or reduced losses."},{id:"CI6",number:6,cluster:"Cluster II: Socio-economic development",wording:"Number of value chain actors that have introduced a new or improved existing business model in support of ecosystem-based adaptation practices as a result of project activities.",cite:"S005 PDF p.15-17",disaggregation:"Level, new or improved, type of value chain, type of actor (producers; producer organizations; processors; certification bodies; traders; service providers; financial institutions; government or public sector; NGOs, civil society or research).",gender_note:"No gender field. Add women-led enterprises as a project-specific sub-indicator.",caveats:"Awareness raising or training alone does not count. Needs a demonstrable change in how the entity operates."},{id:"CI7",number:7,cluster:"Cluster II: Socio-economic development",wording:"Number of jobs created as a result of project activities.",cite:"S005 PDF p.18-19",disaggregation:"By gender, youth (working age up to 24) and Indigenous Peoples.",gender_note:"Gender disaggregation is built in.",caveats:"Decent work conditions required. Jobs must be demonstrably attributable to the project. Employment type and duration are recorded."},{id:"CI8",number:8,cluster:"Cluster II: Socio-economic development",wording:"Number of people with increased income as a result of project activities.",cite:"S005 PDF p.20",disaggregation:"By gender, youth and Indigenous Peoples, plus percentage increase.",gender_note:"Gender disaggregation is built in.",caveats:"Needs baseline and endline income data. Only income from decent working conditions counts."},{id:"CI9",number:9,cluster:"Cluster III: Ecosystem health",wording:"Area of ecosystems under improved practices for conservation, restoration and/or sustainable use as a result of project activities.",cite:"S005 PDF p.21-24",disaggregation:"Hectares or kilometres of coastline, split between field implementation and policies or plans targeted at specific areas.",gender_note:"No gender field. Women's share of land managers can be a project-specific sub-indicator.",caveats:"Results must be achieved during the project period. Area under improved practices through policies or plans counts, taken from the policy or plan itself. A planned but not yet established protected area does not count."},{id:"CI10",number:10,cluster:"Cluster IV: Knowledge generation",wording:"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.",cite:"S005 PDF p.25-27",disaggregation:"Type of resource, decision-making actor, whether applied, whether innovative.",gender_note:"No gender field. Add a project-specific sub-indicator on gender-responsive content.",caveats:"Expected to come with an operational plan for application and adoption. Producing or disseminating a report, or holding a workshop, does not on its own show application."},{id:"CI11",number:11,cluster:"Cluster V: Financing for EbA",wording:"Volume of private and/or public finance leveraged for ecosystem-based approaches for adaptation as a result of project activities.",cite:"S005 PDF p.28-30",disaggregation:"Public or private, mobilised or catalysed, funder, mechanism.",gender_note:"No gender field. Add the share of leveraged finance aimed at women-led activity as a project-specific sub-indicator.",caveats:"Counts only formally committed funds (signed agreement, approved budget allocation, investment decision). Funds under negotiation or at proposal stage do not count."},{id:"CI12",number:12,cluster:"Cluster V: Financing for EbA",wording:"Number of financing instruments developed/improved/under implementation as a result of project activities",cite:"S005 PDF p.31-33",disaggregation:"Type (concessional finance; grants, public finance and budgeting; community incentives; payments for ecosystem services; insurance; tax incentives; bonds; public-private partnerships; market-based instruments; de-risking; debt-for-nature swaps; other), status (developed, improved, under development).",gender_note:"No gender field. Add a project-specific sub-indicator on women's access to the instrument.",caveats:"Developed means concept and operationalisation are agreed by all stakeholders and ready to implement."}],wz={indicators:_z},Sz={no_map_reason:"No map is shown. I did not use verified geodata, and the dashboard avoids security-sensitive location detail. Region-level text only."},xz=[{id:"F01",category:"Climate hazards",text:"Over 70% of Somalia's landmass is arid or semi-arid.",sources:["S010 p.6"]},{id:"F02",category:"Climate hazards",text:"The 2020 to 2023 drought was one of the worst in four decades. In October 2022 it affected 7.8 million people, 46% of the population.",sources:["S010 p.5"]},{id:"F03",category:"Climate hazards",text:"The 2025 Deyr rains failed across most of the country. Southern Deyr cereal output was 15,600 tonnes, 83% below the 1995 to 2024 average and the lowest since 1995.",sources:["S011 slide 6"]},{id:"F04",category:"Climate hazards",text:"Rangeland condition deteriorated sharply nationwide in the 2025 to 2026 season.",sources:["S011 slide 6"]},{id:"F05",category:"Climate hazards",text:"2023 Deyr floods came with El Nino and a positive Indian Ocean Dipole. OCHA reported about 2 million people affected and 750,000 displaced by 30 November 2023. A child-rights alliance gives 1.2 million displaced for the same event.",sources:["S021","S038"],flag:"summary; two figures conflict"},{id:"F06",category:"Climate hazards",text:"The October to December 2026 outlook shows a 90% chance of enhanced rainfall over central and southern Somalia, with warmer-than-average temperatures and flood risk.",sources:["S020"],flag:"summary"},{id:"F07",category:"Climate hazards",text:"The Juba and Shabelle rivers start in the Ethiopian highlands. There are no formal water-sharing agreements.",sources:["S010 p.7"]},{id:"F08",category:"Climate hazards",text:"Climate change could cut GDP by up to 13.5% by 2060 without urgent action. Targeted investment could halve the losses.",sources:["S016"]},{id:"F09",category:"Climate hazards",text:"ND-GAIN ranks Somalia 162nd with a score of 37.5, high vulnerability and low readiness. The source page is inconsistent on rank wording.",sources:["S039"],flag:"summary"},{id:"F10",category:"Food security and humanitarian",text:"January 2026: 4.8 million people in IPC Phase 3 or worse, including 1.2 million in
