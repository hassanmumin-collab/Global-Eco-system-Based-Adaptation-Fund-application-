erActiveDot",function(b,P,O){var E;return $.isValidElement(b)?E=$.cloneElement(b,P):je(b)?E=b(P):E=U.createElement(ZC,P),U.createElement(St,{className:"recharts-active-dot",key:O},E)});var S=$.forwardRef(function(P,O){return U.createElement(x,wa({},P,{ref:O}))});return S.displayName=x.displayName,S},Ii=HG({chartName:"BarChart",GraphicalChild:Bt,defaultTooltipEventType:"axis",validateTooltipEventTypes:["axis","item"],axisComponents:[{axisType:"xAxis",AxisComp:Vn},{axisType:"yAxis",AxisComp:Kn}],formatAxisMap:i8});const VG=JSON.parse(`[{"id":"OPT-A","name":"Agroecology investment pathway","sector":"Agriculture and agroecology","pitch":"Turn proven agroecology and agroforestry practices into a costed, funder-ready package that regional agriculture and climate departments can adopt and larger funds can finance.","fund_alignment":{"strategic_objective":"SO3","pillars":["P1-financing","P1-value_chain"],"theme":"Theme 1: Innovative finance solutions for EbA","justification":"SO3 asks to expand access to finance for scaling EbA (S002 printed p.4). Theme 1 invites proposals that build a business case for the bankability of existing EbA approaches and technical capacity for fundable project pipelines (S001 p.4). Two Pillar 1 levers (financing, value chain) are allowed together and exclude Pillars 2 and 3 (S002 printed p.12).","call_text":["S001 p.4","S002 printed p.5","S002 printed p.12"]},"outcome":{"statement":"Within 24 months, two Federal Member State agriculture and climate departments and the farmer organisations in two project areas use an agroecology-based adaptation package in their extension and planning, and a costed investment concept built on that package enters the pipeline of at least one larger climate funder.","change_type":"practice, plan and finance"},"outputs":[{"id":"O1","title":"Validated agroecology adaptation package for riverine and agro-pastoral farms","activities":["Run a rapid climate-risk and impact-chain analysis for two farming systems using existing IPC, SWALIM and NCCAP data.","Carry out a gender analysis and participatory prioritisation with farmer groups, including women and minority-clan farmers.","Cost and compare four to six practices (agroforestry, conservation tillage, water harvesting, diversification, improved seed) using partner demonstration data, with small on-farm validation plots where data are missing.","Co-design an extension curriculum and short advisory messages with ministry extension staff.","Train trainers: extension staff and women lead farmers, with at least 80% attendance to count."]},{"id":"O2","title":"Investment-ready concept and finance pathway for scaling the package","activities":["Map entry points and requirements of larger funders (Adaptation Fund Hal-abuur, GCF pipeline, World Bank, bilateral).","Test two or three business models with input suppliers, cooperatives and mobile-money or microfinance providers.","Set up a regional multi-stakeholder coordination platform on agroecology and climate.","Draft and test a MEL instrument to track adoption of the package.","Prepare and submit an investment concept note with the lead partner and ministry counterparts."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"Number of regional or national agriculture and climate plans or instruments that name agroecology or EbA practices: to be established in months 1 to 3.","indicative_target":"2 policy instruments influenced, 1 adopted","gender_disaggregation":"No Fund gender field. Add a project sub-indicator: instruments that include women farmers' needs.","note":"Count each jurisdiction separately.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI6","exact_wording":"Number of value chain actors that have introduced a new or improved existing business model in support of ecosystem-based adaptation practices as a result of project activities.","baseline":"Number of value chain actors with an EbA-linked business model: to be established.","indicative_target":"At least 4 actors","gender_disaggregation":"Add a sub-indicator: women-led enterprises among actors.","note":"Training alone does not count. Needs a demonstrable change in how the actor operates.","cif_cite":"S005 PDF p.15-17"},{"core_id":"CI10","exact_wording":"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.","baseline":"Knowledge products and tools: to be established.","indicative_target":"5 to 7 products incl. curriculum and costing tool","gender_disaggregation":"Add a sub-indicator: products with gender-responsive content.","note":"Each product needs a plan for application.","cif_cite":"S005 PDF p.25-27"},{"core_id":"CI12","exact_wording":"Number of financing instruments developed/improved/under implementation as a result of project activities","baseline":"Financing instruments for EbA in the target areas: none known, to be confirmed.","indicative_target":"1 instrument developed","gender_disaggregation":"Add a sub-indicator on women's access to the instrument.","note":"Developed means agreed by all stakeholders and ready to implement.","cif_cite":"S005 PDF p.31-33"}],"theory_of_change":["Problem: farmers know climate-smart practices but lack costed evidence, extension content and finance to adopt them at scale (S011 slide 6; S010 p.19).","Output 1 produces a validated and costed package that ministry staff and farmers help design, so it is credible and usable.","Output 2 turns the package into business models and a funder-ready concept, so scaling does not depend on one small grant.","If extension staff and farmer groups use the package and a funder reviews the concept, then practices spread through existing channels and a larger source of money can pay for them.","This contributes to the NCCAP targets of cutting drought crop failure by 40% and reaching 75% of farmers with climate-smart practices by 2029 to 2030 (S010 p.19).","Long-term impact: more stable farm output and household food supply under drought and flood."],"assumptions":["At least one larger funder is open to a pipeline concept within the project period.","Ministry counterparts stay in post and engage without funding.","Partner demonstration data exist and can be shared."],"risks":[{"risk":"Funder timelines run past month 24, so no concept is formally accepted.","mitigation":"Agree a pre-submission dialogue with funder staff by month 6 and report accepted-for-review as the milestone."},{"risk":"Practices fail in a bad season and farmers lose trust.","mitigation":"Offer a practice menu, not one practice. Use validation plots and honest failure reporting."},{"risk":"For-profit actors capture Fund money.","mitigation":"Fund pays for analysis and capacity only. No commercial revenue is funded (S002 printed p.14)."}],"policy_anchors":[{"anchor":"NCCAP Area 1: agriculture, livestock, fisheries and food security","detail":"Targets: reduce crop failures from drought 40% by 2030 (NAP); climate-smart practices by up to 75% of farmers by 2029 (NTP). Key actions include agroforestry, climate-resilient value chains and early warning.","source_ids":["S010 p.19"]},{"anchor":"NCCAP priority project: pilot agroforestry, sustainable livestock and community-based natural resource management","detail":"Listed as a priority project from the NAP.","source_ids":["S010 p.20"]},{"anchor":"Digital Climate Advisory System","detail":"Priority project from the NTP. The extension content can feed it.","source_ids":["S010 p.20"]}],"scaling_pathway":{"funders":["Adaptation Fund Hal-abuur (IFAD, USD 10 million, to 2032)","GCF Somalia pipeline (FAO-led projects)","World Bank","Bilateral donors named in NCCAP (EU, Germany, Norway, UK)"],"how":"The costed package and investment concept give these programmes a ready design for the farming systems they already target. Source IDs: S017, S019, S010 p.39.","source_ids":["S017","S019","S010 p.39"]},"consortium":{"lead":"SOS Children's Villages Somalia or another lead to be decided (see information_needed_from_SOS.md)","local_partner":"A Somali agricultural NGO or cooperative union that receives at least 25% of the budget","government_role":"Ministry of Agriculture and state agriculture departments co-design and adopt the package. No funds to government.","academic_private":"A Somali or regional university for costing and data. A financial service provider or input supplier as an unfunded business-model partner.","notes":"Both the Fund and the call encourage unlikely partners (S001 p.7)."},"exit_strategy":"Curriculum and costing tool are handed to the ministry extension service and the coordination platform. The investment concept stays with the local partner and ministry as co-owners. Roles are written down by month 6, as the Manual requires (S002 printed p.20).","budget":{"lines":[{"line":"Output 1: climate-risk and impact-chain analysis, gender analysis, practice costing, on-farm validation plots","usd":68000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: extension curriculum co-design, training of trainers","usd":53000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: agroecology and economics technical advice (regional or international)","usd":27500,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: finance pathway mapping and funder engagement","usd":33000,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: business models with value chain actors and coordination platform","usd":57000,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: investment concept note and submission support","usd":27500,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"},{"line":"Lead organisation technical staff time for both outputs","usd":65000,"kind":"output_1","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it.","Local partner recipient lines count towards the 25% rule (S001 p.8)."],"checks":{"total_usd":500000,"local_partner_usd":203000,"local_partner_pct":40.6,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P13","how_differs":"Indonesia coffee field schools worked inside an existing national extension system. This option does the same in a fragile setting and adds a funder-ready finance pathway."},{"project_id":"P49","how_differs":"Honduras and Guatemala generated evidence on EbA and climate-smart villages. This option turns evidence into a costed package and a concept note."},{"project_id":"P50","how_differs":"Costa Rica removed barriers to finance under a national plan with a private trader. Somalia has no equivalent national crop plan, so the pathway runs through donor pipelines."},{"project_id":"P19","how_differs":"The Levant project fed policy papers into NDC updates. This option links directly to NCCAP targets and funder pipelines."}],"somalia_fit":"High policy fit with NCCAP Area 1 (S010 p.19). Hal-abuur gives a scale vehicle (S017). Risk: agriculture is the most crowded humanitarian and donor sector, so added value must be clear.","sos_fit":"Medium. SOS runs family strengthening and hydroponic farming and livestock restocking activities (S037), but has no public record of agroecology or finance work. Needs a strong technical partner.","security_access":"Work can be run with local partners and ministry staff in locations chosen after a restricted security review. Several southern farming areas have heavy or very heavy access restrictions (S042).","esms_notes":"Likely low to medium risk (self-assessed, the Fund Secretariat screens). Watch: seed and input provision, land tenure, women's workload. No Indigenous Peoples are identified, but this must be checked.","fpic_land_clan":"Land tenure and clan access to farmland must be mapped before plots are set up. Use existing, consented sites. Confirm whether any group qualifies as Indigenous Peoples under the Fund ESMS. I cannot confirm this.","conflict_sensitivity":"Choose practices that do not shift water or land access between clans. Use a conflict impact assessment, which the NCCAP asks for in all climate projects (S010 p.37).","feasibility_24m":"Feasible. Analysis, curriculum and concept note fit in 24 months. Formal funder acceptance is the main timing risk.","evidence_notes":"Strong NCCAP anchors. Weak public evidence on current agroecology practice costs in Somalia. I cannot confirm any local cost data.","duration_months":24,"esms_self_assessed":"Low to medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Small on-farm validation plots only, justified where data are missing. Core outputs are a package and a finance concept."},{"id":"OPT-B","name":"Rangeland governance and restoration finance","sector":"Rangelands and pastoralism","pitch":"Help pastoral communities, clan elders and regional authorities agree grazing and restoration plans, track rangeland condition together, and prepare an investment case that larger funds can finance.","fund_alignment":{"strategic_objective":"SO2","pillars":["P1-policy","P2"],"theme":"Theme 2: EbA for human development and security","justification":"SO2 targets planning and governance gaps (S002 printed p.4). Pillar 2 covers data and science with an operational plan for use (S002 printed p.6). One Pillar 1 lever (policy) can be added to Pillar 2 (S002 printed p.12). Theme 2 asks for community co-designed work that lowers natural-resource tension in fragile settings with a measurable pathway (S001 p.5).","call_text":["S001 p.5","S002 printed p.4","S002 printed p.6","S002 printed p.12"]},"outcome":{"statement":"Within 24 months, regional authorities, clan-based grazing committees and pastoral associations in two project areas apply written grazing management and rangeland restoration plans, supported by a shared monitoring tool, and an investment case for scaling them is accepted for review by at least one larger funder.","change_type":"plan, practice and finance"},"outputs":[{"id":"O1","title":"Negotiated rangeland and grazing management plans for two areas","activities":["Map rangeland condition, water points, seasonal routes and customary use rights using existing SWALIM and remote-sensing data and elder knowledge.","Hold facilitated dialogues among clans, women's groups and youth to agree grazing and restoration priorities, with a conflict impact assessment first.","Draft area plans that include rotational grazing, reseeding sites and protection of key water and fodder areas.","Validate plans with regional authorities as unfunded co-owners.","Establish or strengthen a grazing and water committee with women's and youth seats."]},{"id":"O2","title":"Shared monitoring tool and investment case for rangeland restoration","activities":["Design a simple community monitoring method for pasture and water, linked to national early warning data.","Train community monitors, with at least a third women.","Test the monitoring method through two seasons and publish a short results brief.","Cost restoration, fodder-bank and livestock insurance options using partner and FAO data.","Prepare an investment case and meet at least two funders."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"Number of local or regional rangeland plans or instruments that include EbA: to be established.","indicative_target":"2 plans developed, at least 1 adopted","gender_disaggregation":"Add a sub-indicator: plans that record women's access and voice.","note":"Report each area plan separately.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI2","exact_wording":"Number of new or improved institutionalised coordination mechanisms established within or across sectors and at different scales (global, regional, national, sub-national) that address ecosystem-based approaches for adaptation to climate change as a result of project activities.","baseline":"Existing grazing or water committees with EbA mandate: to be established.","indicative_target":"2 committees new or improved","gender_disaggregation":"Report share of women and youth members from the stakeholder list.","note":"Must be institutionalised with a longer-term goal. Ad-hoc dialogues do not count.","cif_cite":"S005 PDF p.7-8"},{"core_id":"CI3","exact_wording":"Number of monitoring, evaluation and learning (MEL) instruments introduced or improved to monitor the effectiveness of ecosystem-based adaptation measures aimed to improve resilience of ecosystems and communities as a result of project activities. The indicator can be set at various scales (global, regional, national, or sub-national as well as sector/ecosystem-specific) depending on the scope of the project.","baseline":"MEL instruments for rangeland condition used by communities or authorities: none known.","indicative_target":"1 instrument introduced","gender_disaggregation":"Disaggregate monitors by gender.","note":"Must explain who maintains it after the project and with what resources.","cif_cite":"S005 PDF p.9-11"},{"core_id":"CI9","exact_wording":"Area of ecosystems under improved practices for conservation, restoration and/or sustainable use as a result of project activities.","baseline":"Hectares of rangeland with an agreed management or restoration plan: to be established through mapping.","indicative_target":"To be set after mapping. Count only area covered by adopted plans.","gender_disaggregation":"No Fund gender field.","note":"Area through policies or plans counts if taken from the plan itself.","cif_cite":"S005 PDF p.21-24"}],"theory_of_change":["Problem: rangelands are deteriorating sharply while grazing governance is contested and under-funded (S011 slide 6; S010 p.7).","Output 1 gives communities and authorities a negotiated plan with recognised rights, so grazing and restoration decisions have legitimacy.","Output 2 gives them evidence from monitoring and a costed investment case, so plans can attract money beyond this grant.","If clans, women's groups and authorities co-own the plans and see monitored results, then compliance rises and tension over pasture and water falls.","This contributes to the NCCAP targets to restore 40% of degraded forest and rangeland by 2029 and cut livestock mortality 30% by 2030 (S010 p.19, p.23).","Long-term impact: healthier rangelands, more stable herds and less climate-linked conflict."],"assumptions":["Clan elders and authorities accept a neutral convenor.","National early warning data (SWALIM, IPC) remain available.","A funder will review a restoration or insurance case within the period."],"risks":[{"risk":"Plans favour powerful clans and deepen tension.","mitigation":"Use conflict impact assessment, an elder and women's panel, and a clear grievance route."},{"risk":"Access limits meetings or monitoring.","mitigation":"Local partner leads delivery. Hybrid methods and community monitors reduce travel."},{"risk":"Reseeding or enclosures become stand-alone field works.","mitigation":"Keep field work to small justified test sites and make the plan the core output (S002 printed p.3)."}],"policy_anchors":[{"anchor":"NCCAP Area 1 and Area 3 rangeland actions","detail":"Restore degraded pasture and rangelands, rotational grazing, restore 40% of degraded forest and rangeland by 2029 (NAP).","source_ids":["S010 p.19","S010 p.23","S010 p.24"]},{"anchor":"NCCAP Area 6: disaster risk management","detail":"Strengthen coping mechanisms for pastoralists such as mobility support and fodder banks.","source_ids":["S010 p.29"]},{"anchor":"NTP climate security nexus as entry point","detail":"Climate-sensitive peacebuilding, inclusive natural resource governance and conflict resolution platforms.","source_ids":["S010 p.7","S010 p.17"]}],"scaling_pathway":{"funders":["Adaptation Fund Hal-abuur (agro-pastoral and pastoral ecosystems)","GCF Somalia pipeline","World Bank resilience programmes","Government budget through MoECC climate finance unit"],"how":"Plans and monitoring give Hal-abuur and GCF a participatory design for rangeland components. The investment case supports the draft National Climate Finance Policy pipeline. Source IDs: S017, S019, S010 p.12.","source_ids":["S017","S019","S010 p.12"]},"consortium":{"lead":"SOS Children's Villages Somalia or another lead to be decided","local_partner":"A Somali pastoral or environmental NGO with clan credibility, receiving at least 25%","government_role":"State environment and range or livestock departments, plus MoECC, co-own plans. No funds to government.","academic_private":"A university or SWALIM-linked technical partner for mapping and monitoring. A livestock insurance provider as an unfunded advisor.","notes":"Do not offer seed grants or herd distribution. The Fund does not support them (S006 p.5)."},"exit_strategy":"Plans, committees and the monitoring tool are owned by the grazing committees and regional authorities. A named local partner keeps the monitoring data. The investment case stays with the ministry and partner for follow-up.","budget":{"lines":[{"line":"Output 1: participatory rangeland mapping and rights and tenure mapping with clan elders, women and youth","usd":86000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: negotiation of grazing management and restoration plans, conflict-sensitive facilitation","usd":67000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: rangeland ecology and remote sensing technical advice","usd":30500,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: community rangeland monitoring and early warning tool linked to national data","usd":55000,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: investment case for restoration and fodder or insurance options","usd":42500,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: technical staff of lead for both outputs","usd":50000,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it."],"checks":{"total_usd":500000,"local_partner_usd":233000,"local_partner_pct":46.6,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P45","how_differs":"CARE Tanzania built EbA awareness and trained officials in drylands. This option adds negotiated grazing plans with rights mapping and a finance case, in a fragile setting."},{"project_id":"P52","how_differs":"CI Kenya researched whether grassland restoration affects peace. This option uses that kind of evidence logic to build plans, not just research."},{"project_id":"P39","how_differs":"WWF Mexico worked on four ranches and was field-heavy. This option works at plan and governance level."},{"project_id":"P15","how_differs":"The global dryland women's policy project works at UN level. This option applies gender-responsive governance at local committee level."}],"somalia_fit":"High. Pastoralism is central to Somali livelihoods and the NCCAP names rangeland restoration (S010 p.19, p.24). No listed Fund project covers rangeland governance in the Horn (S004).","sos_fit":"Low to medium. SOS runs livestock restocking for female-headed families (S037) but its mission is child and family focused. A strong pastoral partner is essential.","security_access":"High risk. Pastoral zones overlap with areas of restricted access and clan conflict (S010 p.7; S042). Site choice needs a restricted security review.","esms_notes":"Medium risk (self-assessed). Watch: clan conflict, elite capture, exclusion of minority clans and women, livestock mobility. Not high risk if the conflict impact assessment is done.","fpic_land_clan":"Customary tenure and xeer rights matter. I found no source on women's rights in Somali rangelands. I cannot confirm this. Treat tenure mapping as an early activity.","conflict_sensitivity":"Highest of all options. A badly run plan can shift power. Use neutral facilitation, a do-no-harm review, and a grievance mechanism.","feasibility_24m":"Feasible for two small areas. Negotiation takes time. Monitoring over two seasons is possible only if the project starts before a rainy season.","evidence_notes":"Strong anchors (NCCAP, IPC). Weak evidence on Somali grazing governance and women's roles. I cannot confirm tenure data.","duration_months":24,"esms_self_assessed":"Medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Small test sites for reseeding only if justified. Core outputs are plans, committees and a monitoring tool."},{"id":"OPT-C","name":"Coastal fisheries and mangrove value chain","sector":"Fisheries and coastal or mangrove ecosystems","pitch":"Cut post-harvest losses and protect mangroves by building ecosystem-friendly fishery business models, a community mangrove stewardship agreement and a blue-finance feasibility case.","fund_alignment":{"strategic_objective":"SO3","pillars":["P1-value_chain","P1-financing"],"theme":"Theme 1: Innovative finance solutions for EbA","justification":"SO3 covers new finance and private investment in EbA (S002 printed p.4). Theme 1 invites EbA-derived value chains, market-ready pathways and bankability cases (S001 p.4). The value chain lever is described with examples of changed business models (S002 printed p.5). Two Pillar 1 levers exclude Pillars 2 and 3.","call_text":["S001 p.4","S002 printed p.5","S002 printed p.12"]},"outcome":{"statement":"Within 24 months, fish processors, traders and fisher associations in one coastal area adopt post-harvest and mangrove-friendly practices through new or improved business models, and a community mangrove stewardship agreement and a blue-finance concept are in place for follow-on investment.","change_type":"practice, business model and finance"},"outputs":[{"id":"O1","title":"Ecosystem-friendly fishery business models tested with women processors and fisher associations","activities":["Map the fish value chain and losses using the Ministry of Fisheries and Blue Economy baseline and field interviews.","Run a gender analysis of processing, trading and decision roles.","Design two or three business models for ice supply, cold storage, drying or handling, with unfunded private partners.","Support one pilot per model through technical assistance only, not equipment grants.","Document results and cost-benefit in a short guide for ministry and funders."]},{"id":"O2","title":"Community mangrove stewardship agreement and blue-finance concept","activities":["Map mangrove and shoreline condition with community monitors, using existing FAO-SWALIM data as baseline.","Facilitate a co-management agreement among fisher associations, local authority and clan leaders.","Assess options such as payments for ecosystem services, microinsurance and blended finance.","Develop a monitoring instrument for mangrove and catch indicators.","Prepare a finance concept and brief regional and national authorities."]}],"indicators":[{"core_id":"CI5","exact_wording":"Number of supply chains made more stable through ecosystem-based approaches as a result of project activities.","baseline":"Fish supply chains in the project area with stable output: to be established.","indicative_target":"1 supply chain","gender_disaggregation":"No Fund gender field. Add a sub-indicator on women processors' share of supply.","note":"One row per supply chain. Stability shown by lower losses.","cif_cite":"S005 PDF p.14-15"},{"core_id":"CI6","exact_wording":"Number of value chain actors that have introduced a new or improved existing business model in support of ecosystem-based adaptation practices as a result of project activities.","baseline":"Value chain actors with EbA-linked business model: to be established.","indicative_target":"At least 6 actors","gender_disaggregation":"Add a sub-indicator: women-led processing enterprises.","note":"Awareness raising alone does not count.","cif_cite":"S005 PDF p.15-17"},{"core_id":"CI9","exact_wording":"Area of ecosystems under improved practices for conservation, restoration and/or sustainable use as a result of project activities.","baseline":"Hectares or kilometres of mangrove and coastline under an agreed stewardship agreement: to be mapped.","indicative_target":"To be set after mapping","gender_disaggregation":"No Fund gender field.","note":"Counted through the agreement or plan.","cif_cite":"S005 PDF p.21-24"},{"core_id":"CI12","exact_wording":"Number of financing instruments developed/improved/under implementation as a result of project activities","baseline":"Financing instruments for coastal EbA: none known.","indicative_target":"1 instrument developed","gender_disaggregation":"Add a sub-indicator on women's access.","note":"Developed means ready to implement.","cif_cite":"S005 PDF p.31-33"}],"theory_of_change":["Problem: fish are lost after landing for lack of ice and cold storage, and coastal ecosystems and incomes are under climate and fishing pressure (S024; S010 p.5).","Output 1 shows that better handling business models are workable and pay back, which gives actors a reason to change practice.","Output 2 secures community stewardship of mangroves and a finance concept, so protection is paid for and not only requested.","If actors adopt the models and communities hold a stewardship agreement, then losses fall and mangrove pressure eases.","This supports the NCCAP priority to revitalise fisheries and reduce post-harvest losses, and to restore mangroves on the southern coast (S010 p.20, p.24).","Long-term impact: steadier fishing income and healthier coastal buffers."],"assumptions":["Reliable power or ice supply options can be found.","A private partner is willing to test models without Fund money for commercial gain.","Community leaders accept a co-management agreement."],"risks":[{"risk":"Fund money leaks into for-profit activity.","mitigation":"Fund only technical assistance and analysis. No equipment grants or commercial revenue (S002 printed p.14, p.23)."},{"risk":"Coastal sites are hard to reach or insecure.","mitigation":"Choose one accessible area after a restricted review. Use local partner and remote monitoring."},{"risk":"Thin Somali mangrove data.","mitigation":"Use community mapping as baseline and say so honestly."}],"policy_anchors":[{"anchor":"NCCAP Area 1 fisheries action and NTP priority project","detail":"Revitalise the fisheries sector, reduce post-harvest losses, improve value chains and governance.","source_ids":["S010 p.19","S010 p.20"]},{"anchor":"NCCAP Area 3 mangrove restoration priority project","detail":"Launch mangrove restoration initiatives along the southern coast (NAP and NTP).","source_ids":["S010 p.24"]},{"anchor":"NCCAP Area 2 coastal protection through ecosystem-based approaches","detail":"Support ecosystem-based approaches like mangrove restoration.","source_ids":["S010 p.21"]}],"scaling_pathway":{"funders":["World Bank fisheries programmes","GCF Somalia pipeline","Adaptation Fund EARNSS and Hal-abuur for coastal NbS links","Private cold-chain and blue-finance investors"],"how":"The business models and finance concept give programmes with fisheries and coastal components a tested design. Source IDs: S047, S018, S019.","source_ids":["S047","S018","S019"]},"consortium":{"lead":"SOS Children's Villages Somalia or another lead to be decided","local_partner":"A Somali coastal fisheries association or NGO, receiving at least 25%","government_role":"Ministry of Fisheries and Blue Economy and the state fisheries department advise and adopt. No funds to government.","academic_private":"A university or marine research partner for mangrove data. A cold-chain company as an unfunded partner.","notes":"Unlikely partnership between a child-focused NGO and a fisheries-finance partner meets the Fund's call for new partners (S001 p.7)."},"exit_strategy":"Business model guide and stewardship agreement are owned by the fisher association and the state fisheries department. The finance concept is held by the local partner and ministry for follow-up with funders.","budget":{"lines":[{"line":"Output 1: value chain and mangrove-fisheries diagnostic with women processors and fisher associations","usd":77500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: business models for ice, cold-chain and handling with value chain actors","usd":64500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: fisheries economics and post-harvest technical advice","usd":32500,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: mangrove co-management agreement and community stewardship plan","usd":58000,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: blue finance feasibility: payments for ecosystem services, insurance, blended finance","usd":45500,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: technical staff of lead for both outputs","usd":53000,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it."],"checks":{"total_usd":500000,"local_partner_usd":225000,"local_partner_pct":45,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P04","how_differs":"Philippines built a municipal financial model for small-scale fisheries. This option works at value chain level and adds mangroves in a fragile setting."},{"project_id":"P27","how_differs":"Myanmar promoted mangrove-friendly aquaculture. Somalia's coast relies on capture fisheries and post-harvest loss reduction."},{"project_id":"P34","how_differs":"Kalimantan restored mangroves within shrimp ponds through a company. This option has no pond restoration and focuses on handling and stewardship."},{"project_id":"P20","how_differs":"Blue Alliance financed marine protected areas through enterprises. This option is smaller and uses technical assistance only."},{"project_id":"P12","how_differs":"Senegal built mangrove monitoring for national MRV. This option uses a simpler community instrument."}],"somalia_fit":"Medium to high. Fisheries and mangroves are named in the NCCAP (S010 p.20, p.24). No Fund project is on Africa's fisheries value chains (S004). Public data are thin and dated (S046).","sos_fit":"Low to medium. SOS works in some coastal districts at region level (S032), but has no fisheries record.","security_access":"Medium to high risk. Coastal areas vary. Site selection must follow a restricted review.","esms_notes":"Low to medium (self-assessed). Watch: exclusion of poorer fishers, restricted mangrove access reducing income, women's workload.","fpic_land_clan":"Customary fishing and shoreline rights are clan-linked. Map them before any agreement. I cannot confirm any legal framework for community mangrove co-management.","conflict_sensitivity":"Medium. Competing fisher groups and outside fleets may raise tension. Co-management must include minority groups.","feasibility_24m":"Feasible for one area. Business model pilots are small. Finance concept takes the longest.","evidence_notes":"NCCAP anchors good. Public evidence on Somali post-harvest value chains is mostly old or summary only (S024, S046, S047).","duration_months":24,"esms_self_assessed":"Low to medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Technical assistance to small pilots, with no equipment grants. Core outputs are business models and a stewardship agreement."},{"id":"OPT-D","name":"Urban EbA planning for Mogadishu and secondary cities","sector":"Urban resilience","pitch":"Give the Benadir Regional Administration and other municipal planners a blue-green risk map, screening guidance for informal and displacement settlements, and a finance pathway for nature-based drainage and greening.","fund_alignment":{"strategic_objective":"SO2","pillars":["P1-policy","P2"],"theme":"Theme 3: Interlinkages for people-nature-climate-land synergies","justification":"SO2 covers planning gaps (S002 printed p.4). Pillar 1 policy includes zoning and building codes for EbA, and Pillar 2 covers risk assessment and scenario modelling (S002 printed p.4-6). Theme 3 supports tools that align NAP, NDC and DRR priorities (S001 p.5-6).","call_text":["S001 p.5-6","S002 printed p.4","S002 printed p.6"]},"outcome":{"statement":"Within 24 months, the Benadir Regional Administration and at least one other municipality use an EbA flood and heat screening tool and zoning guidance in planning decisions for informal and displacement settlements, and a municipal climate finance pathway for nature-based drainage and greening is agreed with at least one funder.","change_type":"policy, plan and finance"},"outputs":[{"id":"O1","title":"Blue-green risk map and EbA screening guidance for municipal planning","activities":["Collect existing flood, drainage, IDP-site and green-space data (SURP II, OCHA, CCCM) and fill gaps through community mapping.","Produce a blue-green flood and heat risk map for selected districts.","Draft an EbA screening checklist and zoning guidance with municipal planners.","Test the guidance on three live planning decisions, including one displacement settlement.","Publish the tool in an open format and train municipal staff."]},{"id":"O2","title":"Municipal finance pathway and inclusive community engagement mechanism","activities":["Review municipal revenue and donor options for nature-based drainage maintenance.","Build a pipeline of three small EbA projects ready for funder review, linked to the Municipal Climate Finance Toolkit.","Set up a community engagement mechanism with women, youth and displaced residents.","Design a MEL instrument to track upkeep of nature-based assets.","Present the pipeline to World Bank and other urban programme staff."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"Municipal planning or zoning instruments that include EbA: none known.","indicative_target":"2 instruments influenced, 1 adopted","gender_disaggregation":"Add a sub-indicator: instruments with provisions for women and displaced residents.","note":"Report each municipality separately.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI2","exact_wording":"Number of new or improved institutionalised coordination mechanisms established within or across sectors and at different scales (global, regional, national, sub-national) that address ecosystem-based approaches for adaptation to climate change as a result of project activities.","baseline":"Municipal coordination mechanisms for climate and EbA: to be established.","indicative_target":"1 new or improved mechanism","gender_disaggregation":"Report women's and displaced residents' participation from the stakeholder list.","note":"Must be institutionalised.","cif_cite":"S005 PDF p.7-8"},{"core_id":"CI3","exact_wording":"Number of monitoring, evaluation and learning (MEL) instruments introduced or improved to monitor the effectiveness of ecosystem-based adaptation measures aimed to improve resilience of ecosystems and communities as a result of project activities. The indicator can be set at various scales (global, regional, national, or sub-national as well as sector/ecosystem-specific) depending on the scope of the project.","baseline":"MEL instruments for nature-based urban assets: none known.","indicative_target":"1 instrument introduced","gender_disaggregation":"Disaggregate community monitors by gender.","note":"Needs a maintenance plan with resources.","cif_cite":"S005 PDF p.9-11"},{"core_id":"CI10","exact_wording":"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.","baseline":"Knowledge products and tools: to be established.","indicative_target":"4 to 6 products","gender_disaggregation":"Add a sub-indicator: products with gender-responsive content.","note":"Each needs a plan for application.","cif_cite":"S005 PDF p.25-27"}],"theory_of_change":["Problem: unplanned urban growth and displacement put informal settlements in flood and heat risk, and nature-based options are not in planning rules (S010 p.6; S029).","Output 1 gives planners a usable map and guidance that fit their decisions.","Output 2 gives them a way to pay for and maintain nature-based assets, and a way for residents to take part.","If planners use the tool on real decisions and residents are heard, then nature-based drainage and greening are adopted and kept up.","This supports the NCCAP target to include climate risk assessments in 100% of new municipal plans by 2030 and the Municipal Climate Finance Toolkit (S010 p.27, p.28).","Long-term impact: fewer flood losses and less heat stress for poor and displaced households."],"assumptions":["Municipal planners engage without funding.","Existing data from SURP II and OCHA can be shared.","No mass evictions occur in the pilot districts."],"risks":[{"risk":"Planning guidance is used to justify evictions.","mitigation":"Add a no-eviction safeguard, consult displaced residents, and review with legal and protection partners."},{"risk":"Municipal budgets do not cover maintenance.","mitigation":"Make a maintenance model part of Output 2 and link it to donor pipelines."},{"risk":"Data are contested or outdated.","mitigation":"Name data sources and dates, and mark uncertainty."}],"policy_anchors":[{"anchor":"NCCAP Area 5: municipalities and urban development","detail":"Climate risk in 100% of new municipal plans by 2030; urban resilience strategies in all states by 2029; nature-based solutions in urban areas; Municipal Climate Finance Toolkit.","source_ids":["S010 p.27","S010 p.28"]},{"anchor":"NCCAP Area 4: urban upgrading in Mogadishu and other cities","detail":"Support urban upgrading and greening in high-density areas exposed to climate hazards.","source_ids":["S010 p.26"]},{"anchor":"Benadir Regional Administration view of the Boondheere pond as a model","detail":"Nature-based water retention supported by SURP II.","source_ids":["S022"]}],"scaling_pathway":{"funders":["World Bank SURP II successor and urban programmes","UNDP and GEF urban resilience project 2026 to 2030 (news report)","GCF","Municipal budgets and the draft National Climate Finance Policy"],"how":"The tool and pipeline give existing urban programmes a ready screening method and a set of project concepts. Source IDs: S022, S048, S010 p.12.","source_ids":["S022","S048","S010 p.12"]},"consortium":{"lead":"SOS Children's Villages Somalia or another lead to be decided","local_partner":"A Somali urban planning, community or engineering NGO, receiving at least 25%","government_role":"Benadir Regional Administration and municipal planning departments co-design and use the tool. No funds to government.","academic_private":"A university GIS or hydrology partner. A private survey or engineering firm may be an unfunded advisor.","notes":"SOS already works with displaced families in Mogadishu (S033). Pairing with a planning partner is an unlikely match (S001 p.7)."},"exit_strategy":"Tool and guidance are handed to the Benadir planning department with training records. The finance pipeline stays with a local partner and the municipality. Roles written by month 6.","budget":{"lines":[{"line":"Output 1: city-wide blue-green flood and heat risk mapping, including IDP settlements","usd":76500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: EbA screening tool and zoning guidance drafted with municipal planners","usd":63500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: urban hydrology and GIS technical advice","usd":38000,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: municipal climate finance toolkit and investment pipeline","usd":50500,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: community engagement mechanism with women, youth and displaced residents","usd":57000,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: technical staff of lead for both outputs","usd":45500,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it."],"checks":{"total_usd":500000,"local_partner_usd":222000,"local_partner_pct":44.4,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P05","how_differs":"Quito developed a Blue-Green Factor tool for a city that already has an NbS programme. This option adapts the idea to informal and displacement settlements."},{"project_id":"P11","how_differs":"Bengaluru's DEFT tool relied on high-resolution spatial data. Mogadishu needs community mapping to fill data gaps."},{"project_id":"P21","how_differs":"Nairobi river regeneration worked with informal settlements. This option adds a municipal finance pathway."},{"project_id":"P18","how_differs":"Niamey produced heat maps and a dashboard for Niger. This option adds flood and screening guidance."},{"project_id":"P38","how_differs":"Amman mainstreamed EbA into urban plans through UN-Habitat. This option is NGO-led and includes displaced residents."}],"somalia_fit":"High. NCCAP Area 5 has explicit targets (S010 p.27). Urban displacement is large (S029). SURP II offers a base and scale route (S022).","sos_fit":"Medium to high. SOS works with families in Banadir, including displaced families (S035, S033). Child and family exposure to flood is a natural link.","security_access":"Medium. Mogadishu is accessible for local partners but has its own risks. Detailed choices belong in a restricted annex.","esms_notes":"Low to medium (self-assessed). Watch: evictions, data privacy of IDP households, exclusion of informal settlements from the process.","fpic_land_clan":"Land tenure in informal settlements is contested. Forced evictions are documented (S029). Include a no-eviction safeguard.","conflict_sensitivity":"Medium. Land and eviction disputes are sensitive. Engage residents and landlords transparently.","feasibility_24m":"Feasible. Tool and guidance fit in 24 months. Adoption in formal rules may take longer, so report 'formally proposed' as a milestone.","evidence_notes":"Strong policy anchors. Urban data conflict across sources (S029 vs S033), so use dated OCHA figures.","duration_months":24,"esms_self_assessed":"Low to medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Community mapping and testing of guidance. No construction."},{"id":"OPT-E","name":"Women-led EbA governance and finance window","sector":"Women-led natural resource governance","pitch":"Put women at the centre of local EbA decisions on water, fodder and woodlots, and design a gender-responsive finance window that the national climate finance system can adopt.","fund_alignment":{"strategic_objective":"SO2","pillars":["P1-education","P1-policy"],"theme":"Theme 3: Interlinkages for people-nature-climate-land synergies","justification":"SO2 covers governance gaps including inclusive stakeholder partnerships (S002 printed p.3-4). Two Pillar 1 levers, capacity building and policy instruments, are allowed together (S002 printed p.4-5, p.12). The Manual asks for gender-responsive design and participation of women (S002 printed p.11, p.20). The NCCAP asks for a dedicated share of climate finance for women-led projects (S010 p.36).","call_text":["S002 printed p.4-5","S002 printed p.11","S002 printed p.20"]},"outcome":{"statement":"Within 24 months, women's groups in two project areas hold recognised seats and decision roles in local water, fodder and woodlot management committees that apply EbA, and a gender-responsive climate finance window is designed and accepted for review by the national climate finance coordination process.","change_type":"governance and finance"},"outputs":[{"id":"O1","title":"Women's leadership and EbA technical capacity","activities":["Run a gender and tenure analysis of water, fodder and woodlot decisions in two areas.","Train 100 to 150 women in EbA planning, tenure rights and negotiation, with at least 80% attendance to count.","Pair women leaders with elders and ministry mentors.","Engage men, elders and religious leaders to build support and reduce backlash.","Support women to present EbA priorities to district and regional bodies."]},{"id":"O2","title":"Gender-responsive EbA guidelines and a women-led finance window design","activities":["Draft guidelines and committee rules that set women's seats and roles in EbA bodies.","Test the rules in two committees and refine them.","Design a finance window for women-led EbA projects, using NCCAP enabling actions as a base.","Develop a MEL instrument that records women's participation and benefits.","Present the window design to MoECC, Ministry of Women and Human Rights Development and funders."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"Local or regional instruments that set women's roles in EbA decisions: none known.","indicative_target":"2 instruments influenced, 1 adopted","gender_disaggregation":"Add a sub-indicator on provisions for women's seats and rights.","note":"Report each jurisdiction separately.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI2","exact_wording":"Number of new or improved institutionalised coordination mechanisms established within or across sectors and at different scales (global, regional, national, sub-national) that address ecosystem-based approaches for adaptation to climate change as a result of project activities.","baseline":"Committees with EbA mandate and women's decision roles: to be established.","indicative_target":"2 committees new or improved","gender_disaggregation":"Report women's share of members and office-holders.","note":"Must be institutionalised.","cif_cite":"S005 PDF p.7-8"},{"core_id":"CI4","exact_wording":"Number of people/beneficiaries supported by the project (directly and indirectly) who have increased their resilience on climate change adaptation through ecosystem-based approaches.","baseline":"Women trained and reached with high-intensity support: to be established.","indicative_target":"100 to 150 direct beneficiaries","gender_disaggregation":"Built in: gender and Indigenous Peoples status.","note":"Public officials trained are not counted. Training must meet the 80% attendance rule.","cif_cite":"S005 PDF p.11-13"},{"core_id":"CI10","exact_wording":"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.","baseline":"Knowledge products and tools: to be established.","indicative_target":"4 to 5 products","gender_disaggregation":"Add a sub-indicator on gender-responsive content.","note":"Each needs a plan for application.","cif_cite":"S005 PDF p.25-27"}],"theory_of_change":["Problem: women carry most of the work and the climate burden but are underrepresented in decisions (S010 p.7; S026; S027).","Output 1 builds women's technical and negotiation skills and builds male and elder support.","Output 2 turns this into written rules and a finance window design, so gains outlast the project.","If women hold recognised roles and a finance route exists, then EbA decisions reflect their knowledge and resources reach them.","This supports the NCCAP enabling action to dedicate a share of climate finance to women- and youth-led projects (S010 p.36).","Long-term impact: more equitable and lasting EbA, and fewer harms to women from climate stress."],"assumptions":["Elders and local authorities accept women's seats.","MoECC and funders engage on a finance window.","Safe venues and travel can be provided."],"risks":[{"risk":"Backlash or gender-based violence against participants.","mitigation":"Early male and elder engagement, safe venues, referral pathways and a GBV risk plan in the ESMS questionnaire (S002 printed p.20)."},{"risk":"Token seats with no real voice.","mitigation":"Track decision roles and office-holders, not only attendance."},{"risk":"The Fund does not allow seed grants (S006 p.5).","mitigation":"Design the finance window, but do not distribute cash to groups through this project."}],"policy_anchors":[{"anchor":"NCCAP enabling action 2: increase funding for women- and youth-led climate projects","detail":"A dedicated percentage of climate finance for women- and youth-led projects. No percentage stated.","source_ids":["S010 p.36"]},{"anchor":"NCCAP guiding principle: gender equality and social inclusion","detail":"Mainstream gender in planning and budgeting, GESI impact assessments, women as climate leaders.","source_ids":["S010 p.17"]},{"anchor":"NCCAP cross-cutting actions","detail":"Women's participation in decision-making in agriculture, water and forest actions.","source_ids":["S010 p.20","S010 p.22","S010 p.24"]}],"scaling_pathway":{"funders":["Draft National Climate Finance Policy and Strategy","GCF and Adaptation Fund gender action plans","UN Women and bilateral gender programmes"],"how":"The finance window design feeds the national climate finance policy while it is under review. Source IDs: S010 p.12, S010 p.36.","source_ids":["S010 p.12","S010 p.36"]},"consortium":{"lead":"SOS Children's Villages Somalia or a women-focused lead to be decided","local_partner":"A Somali women's organisation or network, receiving at least 25%","government_role":"Ministry of Women and Human Rights Development, MoECC and district authorities advise and adopt rules. No funds to government.","academic_private":"A gender and natural resource research partner. A women-led enterprise network as an unfunded advisor.","notes":"Consider making the women's organisation the local lead. The Fund encourages local organisations (S002 printed p.14)."},"exit_strategy":"Rules and committees are owned by district bodies and the women's organisation. The finance window design is held by MoECC and the partner. A women's mentoring network continues unfunded.","budget":{"lines":[{"line":"Output 1: women's leadership and technical programme in EbA planning, tenure rights and negotiation, mentoring","usd":97000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: male and elder engagement, GBV risk measures, and committee-seat negotiations","usd":51500,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: gender and natural resource technical advice","usd":26000,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: gender-responsive EbA guidelines and committee rules drafted and tested","usd":58000,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: design of a women-led climate finance window aligned with the NCCAP","usd":45500,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: technical staff of lead for both outputs","usd":53000,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it."],"checks":{"total_usd":500000,"local_partner_usd":231500,"local_partner_pct":46.3,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P15","how_differs":"Global dryland women's policy work built negotiation skills for UN processes. This option works at local committee level and designs a finance window."},{"project_id":"P41","how_differs":"Nepal integrated women's leadership into local adaptation plans for floods. This option focuses on resource committees and finance in a clan-based setting."},{"project_id":"P23","how_differs":"Indonesia built youth and women stewardship from a tradition. This option is built around formal decision roles."},{"project_id":"P56","how_differs":"Senegal trained women in urban agriculture on flood planning. This option adds committee rules and finance."}],"somalia_fit":"High on policy and need, with clear NCCAP language (S010 p.36). Social acceptance is the main uncertainty.","sos_fit":"Medium to high. SOS works with women-headed families and has a safeguarding certification (S037, S034). It would need EbA and governance partners.","security_access":"Medium. Women's meetings may be easier in some places than large public events, but safety planning is essential.","esms_notes":"Medium (self-assessed). Gender-based violence and backlash risks must be planned for. The Fund requires mitigation in the ESMS questionnaire (S002 printed p.20).","fpic_land_clan":"Women's land and resource rights in clan law are not well documented in the sources I could read. I cannot confirm this. Start with the tenure analysis.","conflict_sensitivity":"Medium. Shifting decision power can create tension. Engage elders early.","feasibility_24m":"Feasible for two areas. Rule adoption by district bodies may take time.","evidence_notes":"Strong policy anchor. Weak Somali-specific data on women's resource rights.","duration_months":24,"esms_self_assessed":"Medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"No physical works. Governance, capacity and finance design only."},{"id":"OPT-F","name":"Juba and Shabelle floodplain EbA and early action","sector":"Water, wetlands and riverine floodplains","pitch":"Join ecosystem-based flood and drought management with disaster planning in riverine districts, and set triggers so anticipatory money is released before floods.","fund_alignment":{"strategic_objective":"SO2","pillars":["P2","P1-policy"],"theme":"Theme 3: Interlinkages for people-nature-climate-land synergies","justification":"SO2 addresses planning gaps (S002 printed p.4). Pillar 2 covers risk assessment and scenario modelling, with operational plans for use (S002 printed p.6). Theme 3 asks for operational coherence across climate, land and disaster risk reduction, anchored in national mandates (S001 p.5-6).","call_text":["S001 p.5-6","S002 printed p.4","S002 printed p.6"]},"outcome":{"statement":"Within 24 months, district authorities and water-user and farmer groups in two riverine districts apply integrated floodplain EbA and disaster risk plans, and agreed triggers link these plans to anticipatory finance.","change_type":"plan and finance"},"outputs":[{"id":"O1","title":"Floodplain ecosystem and scenario assessment co-produced with communities","activities":["Compile existing SWALIM, ICPAC and FEWS NET flood data and El Nino analogue-year records.","Assess floodplain wetlands, riverbank vegetation and recession farming areas with community mapping.","Model flood and drought scenarios for two districts.","Co-validate results with district authorities, water-user groups and women's groups.","Publish a plain-language brief for planners and funders."]},{"id":"O2","title":"Integrated EbA and disaster risk district plans with anticipatory triggers","activities":["Draft EbA measures (wetland retention, bank vegetation, recession-farming support) into district disaster plans.","Set up or improve a district coordination mechanism linking environment, agriculture and disaster staff.","Design anticipatory action triggers with humanitarian and finance partners.","Develop a MEL instrument for floodplain condition and plan use.","Present plans and triggers to MoECC, SoDMA and funders."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"District plans or instruments that include floodplain EbA: none known.","indicative_target":"2 plans developed, 1 adopted","gender_disaggregation":"Add a sub-indicator on provisions for women and displaced households.","note":"Report each district separately.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI2","exact_wording":"Number of new or improved institutionalised coordination mechanisms established within or across sectors and at different scales (global, regional, national, sub-national) that address ecosystem-based approaches for adaptation to climate change as a result of project activities.","baseline":"District coordination mechanisms for EbA and disaster risk: to be established.","indicative_target":"1 new or improved","gender_disaggregation":"Report women's share of members.","note":"Must be institutionalised.","cif_cite":"S005 PDF p.7-8"},{"core_id":"CI9","exact_wording":"Area of ecosystems under improved practices for conservation, restoration and/or sustainable use as a result of project activities.","baseline":"Hectares of floodplain under plans with improved practices: to be mapped.","indicative_target":"To be set after mapping","gender_disaggregation":"No Fund gender field.","note":"Area through plans counts if taken from the plan itself.","cif_cite":"S005 PDF p.21-24"},{"core_id":"CI10","exact_wording":"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.","baseline":"Knowledge products and tools: to be established.","indicative_target":"4 to 6 products","gender_disaggregation":"Add a sub-indicator on gender-responsive content.","note":"Each needs a plan for application.","cif_cite":"S005 PDF p.25-27"}],"theory_of_change":["Problem: floods and droughts repeat on the Juba and Shabelle, with no formal water-sharing agreements upstream and weak local planning (S010 p.7; S021).","Output 1 gives communities and authorities a shared picture of where ecosystems help and where risk is highest.","Output 2 puts that into district plans and triggers so action and money come early.","If districts adopt plans and triggers, then ecosystems are managed to reduce flood and drought losses and relief moves earlier.","This supports NCCAP DRM targets: integrated early warning by 2028 and 30% less climate-induced displacement by 2030 (S010 p.29).","Long-term impact: lower displacement and loss from floods and droughts."],"assumptions":["El Nino rains in late 2026 raise attention and data.","Humanitarian partners agree to test triggers.","District authorities engage without funding."],"risks":[{"risk":"Access limits in riverine districts.","mitigation":"Use local partner, remote data and community monitors. Choose districts after a restricted review (S042)."},{"risk":"Overlap with EARNSS or older UNEP-DHI Juba-Shabelle work.","mitigation":"Review those outputs in the first quarter and build on them (S018). A UNEP and DHI study of nature-based solutions in the Juba-Shabelle basin also appeared in my search and was not read. Say so in the concept note."},{"risk":"Upstream governance cannot be influenced by a Somali project.","mitigation":"Focus on district and national levels and share findings with IGAD."}],"policy_anchors":[{"anchor":"NCCAP Area 6: disaster risk management","detail":"Integrated early warning by 2028; reduce climate-induced displacement 30% by 2030; nature-based solutions such as restoring wetlands to complement infrastructure.","source_ids":["S010 p.29","S010 p.30"]},{"anchor":"NCCAP Area 2: water resource management","detail":"Integrated water resource frameworks, water user coordination, ecosystem-based approaches for coastal and water systems.","source_ids":["S010 p.21","S010 p.22"]},{"anchor":"National Disaster Risk Management Policy 2020","detail":"Community-based DRM and early warning.","source_ids":["S010 p.10"]}],"scaling_pathway":{"funders":["Adaptation Fund EARNSS and Hal-abuur","GCF","World Bank DRM programmes","Humanitarian anticipatory action funds such as CERF"],"how":"District plans and triggers give EARNSS, Hal-abuur and anticipatory action actors a district-level design. Source IDs: S018, S017, S038.","source_ids":["S018","S017","S038"]},"consortium":{"lead":"SOS Children's Villages Somalia or another lead to be decided","local_partner":"A Somali river-basin, DRM or environmental NGO, receiving at least 25%","government_role":"SoDMA, MoECC, state water and agriculture departments co-own plans. No funds to government.","academic_private":"FAO-SWALIM-linked or university hydrology partner. A mobile network or insurer as unfunded advisor on triggers.","notes":"The Joining Forces alliance asked for Somali-led preparedness and embankment work (S038). This option offers the ecosystem and planning side."},"exit_strategy":"District plans and the coordination mechanism are owned by district authorities. Local partner keeps monitoring data. Trigger design stays with SoDMA and humanitarian partners.","budget":{"lines":[{"line":"Output 1: floodplain ecosystem and flood-risk assessment with scenario analysis for El Nino and Indian Ocean Dipole years","usd":84000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: community and district consultations, water-user and farmer group dialogue","usd":58000,"kind":"output_1","recipient":"local_partner"},{"line":"Output 1: hydrology and ecosystem technical advice","usd":39000,"kind":"output_1","recipient":"other_partner"},{"line":"Output 2: integrated EbA and disaster risk district plans","usd":64500,"kind":"output_2","recipient":"local_partner"},{"line":"Output 2: anticipatory action trigger design with humanitarian and finance partners","usd":39000,"kind":"output_2","recipient":"other_partner"},{"line":"Output 2: technical staff of lead for both outputs","usd":46500,"kind":"output_2","recipient":"lead"},{"line":"Gender and inclusion: gender analysis, women's participation costs (childcare, transport, safe venues), male-engagement and GBV risk measures","usd":25000,"kind":"gender_inclusion","recipient":"local_partner"},{"line":"Monitoring, evaluation and learning, baselines and core indicator reporting","usd":25000,"kind":"mel","recipient":"lead"},{"line":"Exit strategy: development and first-year implementation, handover workshops, funder follow-up","usd":15000,"kind":"exit_strategy","recipient":"lead"},{"line":"Project management and coordination (lead organisation)","usd":60000,"kind":"management","recipient":"lead"},{"line":"External audit (required by the Fund)","usd":12000,"kind":"audit","recipient":"external"},{"line":"Indirect costs (placeholder)","usd":32000,"kind":"indirect","recipient":"lead"}],"notes":["Indicative only.","Indirect cost is a placeholder of about 6.4%. The allowed rate is set in the Fund budget template. I cannot confirm it."],"checks":{"total_usd":500000,"local_partner_usd":231500,"local_partner_pct":46.3,"government_usd":0,"has_audit":true,"has_gender_line":true,"has_exit_line":true,"within_cap":true}},"precedents":[{"project_id":"P41","how_differs":"Nepal integrated women-led watershed measures into local plans. This option works with disaster plans and triggers."},{"project_id":"P59","how_differs":"Bangladesh built a community tidal river plan. This option is inland and links to anticipatory finance."},{"project_id":"P56","how_differs":"Thies, Senegal shifted flood management towards ecosystem solutions in a city. This option works in riverine districts."},{"project_id":"P57","how_differs":"Ecuador and Peru built transboundary basin finance. This option stays national and district."},{"project_id":"P31","how_differs":"Costa Rica and Colombia linked EbA to hydropower finance. This option links to disaster finance."}],"somalia_fit":"High and timely. The October to December 2026 forecast points to heavy rain (S020). Hazard links to displacement are strong (S021).","sos_fit":"Medium. SOS works in Hirshabelle and South West, which include riverine areas (S032). Child exposure to floods is a stated concern (S038).","security_access":"High risk. Several riverine districts have heavy or very heavy access restrictions (S042). Design needs remote and local-partner delivery.","esms_notes":"Medium (self-assessed). Watch: land use change on farmland, embankment conflicts, impacts on downstream users.","fpic_land_clan":"Riverbank and floodplain tenure is contested. Map tenure before suggesting measures.","conflict_sensitivity":"Medium to high. Water and land access can raise clan tension.","feasibility_24m":"Feasible for assessment and plans. Anticipatory triggers need a humanitarian partner to adopt them.","evidence_notes":"Good hazard evidence. The 2026 outlook comes from a summary only (S020). Overlap with existing UNEP work needs checking.","duration_months":24,"esms_self_assessed":"Medium","esms_note_status":"Self-assessed by the analyst. The Fund Secretariat screens each shortlisted project. High-risk projects are not eligible (S002 printed p.14).","field_work":"Community mapping and plan testing. No embankment works."},{"id":"OPT-G","name":"Children and youth EbA education and local monitoring","sector":"Youth and children: education and skills","pitch":"Build EbA content into schools and vocational training, and train youth to monitor local ecosystems so that education authorities and climate data systems use what they find.","fund_alignment":{"strategic_objective":"SO1","pillars":["P1-education"],"theme":"Theme 2: EbA for human development and security","justification":"SO1 covers awareness, knowledge and institutional capacity (S002 printed p.4). The Pillar 1 education lever covers inclusion of EbA in formal and informal education and technical and vocational training (S002 printed p.5). Theme 2 covers human development in fragile settings (S001 p.4-5). Pillar 1 alone is one lever, with room for a second.","call_text":["S001 p.4-5","S002 printed p.4-5"]},"outcome":{"statement":"Within 24 months, technical and vocational institutes and schools in two project areas teach an approved EbA module, and youth-led local monitoring data are used by education and environment authorities in their planning.","change_type":"practice and capacity"},"outputs":[{"id":"O1","title":"Approved EbA module and trained instructors for schools and vocational institutes","activities":["Review existing green skills and climate curricula, including the education adaptation roadmap from the Ministry of Environment and Climate Change.","Co-design an EbA module for secondary schools and technical and vocational courses with education authorities.","Test the module with instructors and students, with at least half of learners girls or young women.","Train instructors and teachers, with at least 80% attendance to count.","Submit the module for approval by the relevant education body."]},{"id":"O2","title":"Youth-led local EbA monitoring network linked to authorities","activities":["Select and train youth monitors for simple ecosystem and hazard observations.","Set up a data-sharing protocol with MoECC and climate information systems.","Hold two seasonal reflection events where youth present findings to authorities.","Develop a MEL instrument for the network.","Produce a short guide for scaling the network to other schools."]}],"indicators":[{"core_id":"CI1","exact_wording":"Number of policies or policy instruments developed or influenced that include ecosystem-based approaches for adaptation as a result of project activities.","baseline":"Education or training instruments that include EbA: none known.","indicative_target":"1 instrument influenced, 1 adopted","gender_disaggregation":"Add a sub-indicator on provisions for girls and displaced learners.","note":"Count the curriculum or standard, not training events.","cif_cite":"S005 PDF p.4-7"},{"core_id":"CI3","exact_wording":"Number of monitoring, evaluation and learning (MEL) instruments introduced or improved to monitor the effectiveness of ecosystem-based adaptation measures aimed to improve resilience of ecosystems and communities as a result of project activities. The indicator can be set at various scales (global, regional, national, or sub-national as well as sector/ecosystem-specific) depending on the scope of the project.","baseline":"MEL instruments for youth ecosystem monitoring: none known.","indicative_target":"1 instrument introduced","gender_disaggregation":"Disaggregate monitors by gender.","note":"Must explain who maintains it.","cif_cite":"S005 PDF p.9-11"},{"core_id":"CI4","exact_wording":"Number of people/beneficiaries supported by the project (directly and indirectly) who have increased their resilience on climate change adaptation through ecosystem-based approaches.","baseline":"Youth directly trained with high-intensity support: to be established.","indicative_target":"300 to 500 direct beneficiaries","gender_disaggregation":"Built in: gender and Indigenous Peoples status. Report youth 15 to 24 under type of beneficiary.","note":"Trained officials are not counted. 80% attendance rule applies.","cif_cite":"S005 PDF p.11-13"},{"core_id":"CI10","exact_wording":"Number of evidence-based knowledge products, technical tools, and events developed as a result of project activities.","baseline":"Knowledge products and tools: to be established.","indicative_target":"4 to 6 products","gender_disaggregation":"Add a sub-indicator on gender-responsive content.","note":"Each needs a plan for application.","cif_cite":"S005 PDF p.25-27"}],"theory_of_change":["Problem: young people are most of the population and bear climate and displacement impacts, but EbA is not in what they learn (S010 p.7; S038).","Output 1 puts EbA into approved teaching, so it reaches many learners beyond the project.","Output 2 turns learners into local observers whose data authorities can use.","If EbA content is approved and used, and youth data enter planning, then local EbA knowledge and demand grow.","This supports the NCCAP call for green jobs, education and youth as change agents, and the education adaptation roadmap (S010 p.35, p.36; S051).","Long-term impact: a generation that can plan and manage local ecosystems under climate stress."],"assumptions":["Education authorities approve the module within the period.","Existing SOS and Canada-funded green skills work provides a base without duplication.","Schools and institutes remain open and accessible."],"risks":[{"risk":"Seen as business as usual or overlap with Green Growth (S036).","mitigation":"State clearly what is new: EbA content, authority approval, and monitoring data link. Show where the Green Growth work ends."},{"risk":"Weak ecosystem outcome in the eyes of reviewers.","mitigation":"Tie the monitoring network to specific ecosystems and authority decisions."},{"risk":"Youth recruitment risk or safety concerns.","mitigation":"Safeguarding review, parental consent, and safe venues."}],"policy_anchors":[{"anchor":"NCCAP enabling actions: green jobs, education, youth as change agents","detail":"Just transition, green jobs, education and GESI; youth and women as change agents.","source_ids":["S010 p.35","S010 p.37"]},{"anchor":"MoECC roadmap on education adaptation actions under the NAP (June 2026)","detail":"Seen only as a search summary. I cannot confirm its cont
